<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Tax Forms Admin - Stuff Company, LLC</title>
    <link rel="icon" href="/images/favicon/favicon-32x32.gif" sizes="32x32">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/responsive.css">
    <link rel="stylesheet" href="/tax-form/tax-form.css">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <div class="site-logo">
                <a href="/"><img src="/images/logo.gif" alt="Stuff Company, LLC"></a>
            </div>
        </div>
    </header>

    <main class="main-content">
        <div class="container">
            <div class="page-content tf tf-admin">
                <div class="project-header"><h1>Tax Forms Admin</h1></div>

                <form id="login" class="contact-form" hidden>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" class="form-control" autocomplete="current-password" required>
                    </div>
                    <div class="tf-error" role="alert" hidden></div>
                    <div class="form-group text-center tf-center">
                        <button type="submit" class="btn btn-primary">Sign in</button>
                    </div>
                </form>

                <section id="list" hidden>
                    <div class="tf-toolbar">
                        <span id="count" class="tf-small"></span>
                        <span>
                            <button type="button" class="tf-link" id="refresh">Refresh</button> ·
                            <button type="button" class="tf-link" id="logout">Sign out</button>
                        </span>
                    </div>
                    <div class="tf-error" role="alert" hidden></div>
                    <div class="tf-table-wrap">
                        <table class="tf-table">
                            <thead>
                                <tr>
                                    <th>Submitted</th><th>Name</th><th>Email</th><th>Form</th><th>How</th><th>TIN</th><th></th>
                                </tr>
                            </thead>
                            <tbody id="rows"></tbody>
                        </table>
                    </div>
                    <p class="tf-help">Forms are stored encrypted and decrypted only when you open them. Retention: keep W-9s for 4 years after the last 1099; delete forms you no longer need.</p>
                </section>
            </div>
        </div>
    </main>
    <script src="/admin/tax-forms/admin.js"></script>
</body>
</html>
